# AI レビュー(G-5 の拡張)
#
# **独立レビュー(G-6)の代替ではありません。**
#
# - PR へコメントするだけ。承認(approve)は行わない
# - 必須ステータスチェックにしない。合否条件にすると自動化バイアスを招く
# - 出力は監査の入力として使える。判定そのものには使わない
#
# 権限を pull-requests: write に留め、承認に必要な権限を与えていません。
# 「承認させない」を指示ではなく設定で担保するためです。

name: ai-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: ai-review
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 有効かどうかを確認する
        id: gate
        run: |
          enabled=$(node -e "const c=require('./process.config.json');console.log(c.aiReview?.enabled ? 'yes':'no')")
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: 位置づけを PR へ明記する
        if: steps.gate.outputs.enabled == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "$(cat <<'MD'
          ### AI レビューの位置づけ

          このワークフローが出す指摘は **検出の層** であり、監査の入力です。判定には数えません。

          - 独立レビュー(G-6)の代替にはなりません
          - 承認(approve)は行いません
          - 合否条件にしていないため、指摘が残っていてもマージは止まりません
          - 指摘が無いこと、指摘の外の箇所は、人の確認を減らす理由になりません。G-6 の対象は差分の全体です(標準 第4章 G-6「確認の範囲と深さ」)。指摘は、差分が受入基準の範囲内かを確かめてから読むことを勧めます

          指摘を採るかどうかは、人が判断して記録してください。記録には「AI レビュー通過」ではなく、指摘の内容と採否を残します。
          MD
          )"

      # ここに任意の AI レビューを差し込みます。
      # レビューへ渡すのは仕様・受入基準・差分に限ります。PR の説明文(作成側の説明・主張・推論の過程)を
      # 判断の前に渡してはなりません(入力の分離。標準 第3章 3.5.3)。
      # 出力は「通過」ではなく、指摘の内容として残します。採否は人が記録します。
      # 指摘の内容は、所在(ファイルと行、受入基準の識別子など)と根拠(照らした基準と、見た事実)です。
      # 「実行の結果を述べる指摘は、実行の記録の所在を含める。所在を示せない場合は、実行したコマンドと観測した
      # 結果を書いてよいが、実行で確かめたとは記録しない」。修正案・代替案は求めません(標準 附属書H H.4)。
      # 所在か根拠を欠く指摘は、人が採否の欄に「不採用(所在・根拠なし)」と記録してよいものです。
      # このワークフローは、差し込んだレビューの出力がこれらを満たすかを確かめません(AI維持管理者が四半期に抜き取ります)。
      # レビューの指示(プロンプト・観点の規則のファイル)は、基底ブランチから読みます。PR 自身の変更から読んではなりません
      # (指示の書き換えの防止。標準 附属書H H.4 条件3)。PR の head 側のカスタム指示を読む道具(GitHub Copilot のカスタム指示など)を
      # そのまま使う構成は、この条件を満たしません。同じ PR で指示を変えた場合に、基底の側の指示でレビューさせる仕組みは
      # このテンプレートにまだありません(標準の IMPL-0333 は降りていない)。
      # 承認(gh pr review --approve)を行う実装を追加してはなりません。
      # 追加した場合、契約検査(verify-gate-contract)の意図と矛盾します。
      - name: レビューの実行(未設定)
        if: steps.gate.outputs.enabled == 'yes'
        run: |
          echo "::notice::AI レビューの実装は未設定です。使いたい仕組みをこのステップへ追加してください"
