# マージを契機に、その PR の承認レビューの写しを記録用ブランチ(records)へ置く(process-compass #321 D5〜D7 / ADR-0070)
#
# 写しは、人の判断を含まない機械の複製です。要約と評価を足しません。
# 承認レビューの本文は編集でき、監査ログは 180 日で消え、承認者が退会すると user が ghost になります。
# 写しをマージと同じ時期に取り出し、成立した記録を記録を残さずには書き換えられない場所(履歴の書き換えと削除を規則で止めた
# 記録用ブランチ)へ置くことで、出荷判定(G-7)の時点で、ホスティングから引き直した承認レビューと突き合わせられるようにします。
# 置き場は書き換えを防ぎません。書き込みの権限を持つ者とジョブのトークンは新しいコミットで記録を変えられ、変えた事実は履歴に残ります。
# 出荷の集約が、履歴の走査とホスティングとの突合で書き換えを検出して欠落に数えます(process-compass #379 / ADR-0109)。
#
# 置き場は、既定ブランチではなく、同じリポジトリの記録用ブランチ `records` です(`.github/rulesets/README.md`「記録用ブランチ」)。
# 既定ブランチのルールセットは一切緩めません。bypass actor を足さず、`exempt` を使いません。
# `records` ブランチには `pull_request` の規則が無いため、GITHUB_TOKEN(contents: write)の push が通ります
# (2026-10-23 の実機確認: orphan ブランチの初期化と push。committer は github-actions[bot])。
#
# 書き込みは追記だけです。既存のファイルを書き換えません。同じ PR の写しが既にあれば、比べる欄(マージの時刻までのレビューの識別子・
# 状態・commit_id・submitted_at・user.id・本文と、マージのコミット・head)を今取り出した写しと比べ、一致すれば何もせずに成功で終えます(再実行)。
# 状態と本文も比べるのは、マージの後に先回りで置いた写しの状態・本文の差し替えを、再実行と見なさないためです(process-compass #379 突合 H-2)。
# 食い違えば、取り出した写しを records/conflicts/ へ衝突の記録として追記し、失敗します(既にある写しを、警告だけで正しい写しとして残さない)。
#
# 署名を必須にする構成(records-signed.json。`required_signatures`)では、git push のコミットは署名を持たないため止まります。
# その構成では GraphQL `createCommitOnBranch` で書きます(GitHub が署名する。`gh api graphql`)。経路の判定:
#   構成の回答が規制業(q-quality が quality-regulated)または安全重要度 CL2 以上(q-criticality が cl2・cl3)なら GraphQL 経路、
#   それ以外は git push(scripts/gate/records.mjs の recordsSignatureRequired。集約・開示・ship-evidence.yml と同じ判定。
#   リポジトリの変数には頼らない。process-compass #379 突合 M-7)
# `createCommitOnBranch` は `expectedHeadOid`(ブランチの現在の先頭)を要するため、ブランチが無いときは先に作ります。
# 初期化は git 経路(空の README を持つ orphan コミットの push)で行います。署名が要る構成では、この初期化の push が止まるため、
# 理由を出して失敗します。その場合は人が署名コミットで `records` ブランチを作ります(`.github/rulesets/README.md`「記録用ブランチの初期化」)。
# **GraphQL 経路と `required_signatures` の組は、2026-10-23 時点で実機で確かめていません**(E0)。初回のマージで Actions の記録を確かめてください。
#
# 写しに含めるのは最小の組だけです: pr・merge_commit_sha・head_sha・copied_at、PR の作成者 author{id,login}(作成を指示した者との別と
# G-6 の独立の判定に要る)、reviews[] の id・state・commit_id・submitted_at・user{id,login,type}(User / Bot は API の値。`[bot]` の接尾で推定しない)・body、
# および任意の欄として merged_at・merged_by.login・base.ref・default_branch(マージの時点の既定ブランチ)・title・body・head_ref(next.mjs が機能 ID を Spec: トレーラから引く)。
# 同じ期間の bypass・保護の変更の記録(監査ログ)は、無料のプランでは API で取れません。取れないことを写しに書きます。
#
# 出荷の証跡の集約(aggregate-evidence.mjs)と next.mjs は、この写しを scripts/gate/records.mjs で読みます(段階 2)。
# 基底ブランチへは、出荷判定(G-7)の PR(ship-evidence.yml)が docs/records/reviews/ へ複製して運びます。

# **書き込みの権限(contents: write)を持つため、定義とスクリプトは既定ブランチから読みます**(pull_request_target。process-compass #371 /
# ADR-0115 / 議長の裁定 AR-2)。pull_request の closed では、マージせずに閉じた PR が PR の側の定義(refs/pull/N/merge)で動き、
# `if: merged` の条件を消した定義が contents: write の権限で動きました(2026-11-05 の実機の確認 E-5)。
# pull_request_target は PR の基底に依らず既定ブランチの定義で動きます(E-15)。PR のコードを checkout しません。
# マージした PR では、既定ブランチの先端はその PR の変更を含みます。このファイルを変える PR は統制の設定の変更であり、
# 取り込む前に AI維持管理者本人の承認を要します(gate-g5-base.yml)。

name: record-copy

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: record-copy
  cancel-in-progress: false

jobs:
  copy:
    name: record-copy
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      RECORDS_BRANCH: records
    steps:
      # 既定ブランチの定義で動く(pull_request_target。PR の基底に依らず既定ブランチの定義とスクリプトを読む)。
      # pull_request の closed では、マージせずに閉じた PR は PR の側の定義で動く(実機の確認 E-5)ため、使わない。
      # 既定ブランチを checkout する。ref へ PR の先頭(head)を指定してはならない。
      # 記録用ブランチへ push するため、checkout の資格情報を残す(このジョブは PR のコードを取り出さず、実行しない)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: false
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version

      - name: 承認レビューの写しを取り出す
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # マージの時点の既定ブランチの名前。出荷の集約が base.ref と比べ、既定ブランチ以外へ取り込んだマージを検出する(process-compass #360 H-4 / IMPL-0248。合否に使わない)
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # 題名・本文・head のブランチ名は任意の欄。next.mjs が機能 ID(Spec: トレーラ・F-NNN)を写しから引く。
          # 本文は API の値をそのまま(推定・要約しない)。環境変数で渡し、シェルへ展開しない
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/record-copy
          # レビューはページを跨いで全件取る。推定を含まない写しにするため、欄を選ぶ以外の加工をしない(user.type は API の値をそのまま写す)
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '[.[] | {id, state, commit_id, submitted_at, author_association, user: {id: .user.id, login: .user.login, type: .user.type}, body}]' \
            | jq -s 'add // []' > /tmp/record-copy/reviews.json
          # レビューの本文を書き手以外が編集したか(editor)。効力を持つ記録のレビュー(宣言行 例外承認・停止の解除)は、
          # 書き手以外が編集したものを数えない(process-compass #380 / ADR-0106 / EV-0220)。GraphQL で引けたレビューにだけ edited_by を足す
          # (引けないレビューは edited_by が無く、検査は「編集の記録を読めない」として宣言行のレビューを数えない)
          ed=$(gh api graphql -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F number="$PR" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviews(first:100){nodes{databaseId editor{login}}}}}}' \
            --jq '[.data.repository.pullRequest.reviews.nodes[] | {key: (.databaseId | tostring), value: (.editor.login // "")}] | from_entries' 2>/dev/null) || ed=''
          if [ -n "$ed" ]; then
            jq --argjson ed "$ed" 'map((.id | tostring) as $k | if ($ed | has($k)) then . + {edited_by: (if $ed[$k] == "" then null else $ed[$k] end)} else . end)' /tmp/record-copy/reviews.json > /tmp/record-copy/reviews2.json
            mv /tmp/record-copy/reviews2.json /tmp/record-copy/reviews.json
          fi
          jq -n \
            --arg repo "$REPO" \
            --argjson pr "$PR" \
            --arg merge "$MERGE_SHA" \
            --arg head "$HEAD_SHA" \
            --argjson author_id "${AUTHOR_ID:-null}" \
            --arg author_login "$AUTHOR_LOGIN" \
            --arg merged_at "$MERGED_AT" \
            --arg merged_by "$MERGED_BY" \
            --arg base_ref "$BASE_REF" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg head_ref "$HEAD_REF" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg copied "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile reviews /tmp/record-copy/reviews.json \
            '{
              repository: $repo,
              pr: $pr,
              title: $title,
              body: $body,
              head_ref: $head_ref,
              merge_commit_sha: $merge,
              head_sha: $head,
              author: {id: $author_id, login: $author_login},
              merged_at: $merged_at,
              merged_by: {login: $merged_by},
              base: {ref: $base_ref},
              default_branch: $default_branch,
              copied_at: $copied,
              copied_by: "record-copy workflow (GITHUB_TOKEN)",
              reviews: $reviews[0],
              audit_log: "取れない(組織の監査ログ API は Enterprise Cloud に限る。bypass・保護の変更の記録は、この写しに含まれない)"
            }' > /tmp/record-copy/pr.json
          # 写しの最小の組が揃っていることを確かめる(欠ければ失敗。推定で埋めない)
          jq -e '
            (.pr|type)=="number" and (.merge_commit_sha|type)=="string" and (.head_sha|type)=="string" and (.copied_at|type)=="string"
            and (.author|has("id") and has("login"))
            and ((.reviews // []) | all(has("id") and has("state") and has("commit_id") and has("submitted_at") and has("body") and (.user|has("id") and has("login") and has("type"))))
          ' /tmp/record-copy/pr.json > /dev/null || { echo "::error::写しの最小の組(pr・merge_commit_sha・head_sha・copied_at・author{id,login}・reviews[].{id,state,commit_id,submitted_at,user{id,login,type},body})が揃っていません"; exit 1; }
          echo "::notice::PR #$PR のレビュー $(jq '.reviews | length' /tmp/record-copy/pr.json) 件を写しました"

      # 署名の要否は、構成の回答(規制業・安全重要度 CL2 以上)から1つの関数で導く。集約の欠落・保証の開示と同じ判定
      # (scripts/gate/records.mjs の recordsSignatureRequired。リポジトリの変数に頼らない。process-compass #379)
      - name: 署名の要否を決める
        id: signed
        run: |
          signed=$(node scripts/gate/records.mjs --signature-required)
          echo "::notice::構成の回答から導いた署名の要否: $signed(規制業・CL2 以上で true。true の構成は records-signed.json を適用する)"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: 記録用ブランチへ追記する(git push)
        if: steps.signed.outputs.signed != 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 記録用ブランチが無ければ、履歴を持たない(orphan)ブランチとして初期化する
          if git fetch origin "$RECORDS_BRANCH" 2>/dev/null; then
            git checkout -B "$RECORDS_BRANCH" "origin/$RECORDS_BRANCH"
          else
            git checkout --orphan "$RECORDS_BRANCH"
            git rm -rf --quiet . || true
            printf '# 記録用ブランチ\n\n承認レビューの写し(records/reviews/)と判定記録の様式(records/gates/)を置きます。追記だけを行い、既存のファイルを書き換えません。\n' > README.md
            # 置き場を改行の変換の対象から外す(変換が記録を書き換え、書き換えとして誤検出されるのを避ける。process-compass #379)
            printf '* -text\n' > .gitattributes
            git add README.md .gitattributes
            git commit -m "chore: 記録用ブランチを初期化する"
          fi
          dest="records/reviews/pr-$PR.json"
          if [ -e "$dest" ]; then
            # 追記だけを行う。既存の写しは書き換えない(書き換えは、成立した記録の書き換えとして集約が欠落に出す対象)。
            # 既にある写しと今取り出した写しの比べる欄を比べ、一致すれば再実行として成功で終える。食い違えば、取り出した写しを
            # 衝突の記録として records/conflicts/ へ追記して失敗する(マージより前に置かれた写しの疑い。process-compass #379 / ADR-0109 決定4)。
            # 比べるレビューはマージの時刻までに提出されたものに限る(マージの後のレビューで、正当な再実行を失敗させない)
            shape='(.merged_at // "") as $m | {pr, merge_commit_sha, head_sha, reviews: [(.reviews // [])[] | select($m == "" or .submitted_at == null or .submitted_at <= $m) | {id, state, commit_id, submitted_at, user: {id: .user.id}, body}] | sort_by(.id)}'
            if jq -S "$shape" "$dest" > /tmp/record-copy/have.json 2>/dev/null && jq -S "$shape" /tmp/record-copy/pr.json > /tmp/record-copy/now.json && cmp -s /tmp/record-copy/have.json /tmp/record-copy/now.json; then
              echo "::notice::$dest は既にあり、比べる欄(レビューの識別子・状態・commit_id・submitted_at・user.id・本文・マージのコミット・head)が今取り出した写しと一致します(再実行)。書き換えません"
              exit 0
            fi
            conflict="records/conflicts/pr-$PR-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}.json"
            mkdir -p "$(dirname "$conflict")"
            cp /tmp/record-copy/pr.json "$conflict"
            git add "$conflict"
            git commit -m "records: PR #$PR の写しの取り出しの衝突を記録する(既にある写しと比べる欄が食い違う)"
            git push origin "$RECORDS_BRANCH"
            echo "::error::$dest は既にあり、今取り出した写しと比べる欄が食い違います。既にある写しは書き換えず、取り出した写しを $conflict に記録しました。出荷の集約はこの PR の写しを欠落に数えます"
            exit 1
          fi
          mkdir -p "$(dirname "$dest")"
          cp /tmp/record-copy/pr.json "$dest"
          git add "$dest"
          git commit -m "records: PR #$PR の承認レビューの写しを置く"
          git push origin "$RECORDS_BRANCH"

      # 署名を必須にする構成。GitHub が署名する createCommitOnBranch で 1 ファイルを追記する。
      # ブランチが無いときは、初期化の push(署名なし)が required_signatures で止まるため、理由を出して失敗する
      - name: 記録用ブランチへ追記する(GraphQL createCommitOnBranch。署名つき)
        if: steps.signed.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          dest="records/reviews/pr-$PR.json"
          if ! head=$(gh api "repos/$REPO/git/ref/heads/$RECORDS_BRANCH" --jq '.object.sha' 2>/dev/null); then
            # 初期化を試みる(ルールセットをまだ適用していない構成では通る)。止まれば人が署名コミットで作る
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --orphan "$RECORDS_BRANCH"
            git rm -rf --quiet . || true
            printf '# 記録用ブランチ\n\n承認レビューの写し(records/reviews/)と判定記録の様式(records/gates/)を置きます。追記だけを行い、既存のファイルを書き換えません。\n' > README.md
            printf '* -text\n' > .gitattributes
            git add README.md .gitattributes
            git commit -m "chore: 記録用ブランチを初期化する"
            if git push origin "$RECORDS_BRANCH"; then
              echo "::notice::記録用ブランチを初期化しました(署名なしの初期コミット。ルールセット records-signed.json はこの後に適用する)"
              head=$(git rev-parse HEAD)
            else
              echo "::error::記録用ブランチ $RECORDS_BRANCH が無く、署名を必須にする構成では GITHUB_TOKEN で初期化できません(初期コミットは署名を持たない)。人が署名コミットで作ります: .github/rulesets/README.md「記録用ブランチの初期化」。この PR #$PR の写しは、初期化の後に workflow の再実行で置きます"
              exit 1
            fi
          fi
          # 既にあれば書き換えない(追記だけ)。比べる欄が一致すれば再実行として成功、食い違えば衝突を records/conflicts/ へ追記して失敗する
          # (git push の経路と同じ。process-compass #379 / ADR-0109 決定4)
          headline="records: PR #$PR の承認レビューの写しを置く"
          if gh api "repos/$REPO/contents/$dest?ref=$RECORDS_BRANCH" --jq '.content' > /tmp/record-copy/have.b64 2>/dev/null; then
            shape='(.merged_at // "") as $m | {pr, merge_commit_sha, head_sha, reviews: [(.reviews // [])[] | select($m == "" or .submitted_at == null or .submitted_at <= $m) | {id, state, commit_id, submitted_at, user: {id: .user.id}, body}] | sort_by(.id)}'
            if base64 -d /tmp/record-copy/have.b64 > /tmp/record-copy/have-raw.json 2>/dev/null \
              && jq -S "$shape" /tmp/record-copy/have-raw.json > /tmp/record-copy/have.json && jq -S "$shape" /tmp/record-copy/pr.json > /tmp/record-copy/now.json \
              && cmp -s /tmp/record-copy/have.json /tmp/record-copy/now.json; then
              echo "::notice::$dest は既にあり、比べる欄が今取り出した写しと一致します(再実行)。書き換えません"
              exit 0
            fi
            conflict=1
            dest="records/conflicts/pr-$PR-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}.json"
            headline="records: PR #$PR の写しの取り出しの衝突を記録する(既にある写しと比べる欄が食い違う)"
          fi
          jq -n --arg repo "$REPO" --arg branch "$RECORDS_BRANCH" --arg head "$head" --arg path "$dest" \
            --arg contents "$(base64 -w0 /tmp/record-copy/pr.json)" --arg headline "$headline" \
            '{query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}",
              variables:{input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},message:{headline:$headline},expectedHeadOid:$head,fileChanges:{additions:[{path:$path,contents:$contents}]}}}}' > /tmp/record-copy/body.json
          oid=$(gh api graphql --input /tmp/record-copy/body.json --jq '.data.createCommitOnBranch.commit.oid')
          echo "::notice::署名つきのコミット $oid で $dest を置きました(createCommitOnBranch)"
          if [ "${conflict:-0}" = "1" ]; then
            echo "::error::records/reviews/pr-$PR.json は既にあり、今取り出した写しと比べる欄が食い違います。既にある写しは書き換えず、取り出した写しを $dest に記録しました。出荷の集約はこの PR の写しを欠落に数えます"
            exit 1
          fi
