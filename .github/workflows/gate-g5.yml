# G-5 自動検証(CI)
#
# 必須ステータスチェックの名前は gate-g5 に固定します。個々の検査ジョブではなく、
# 集約ジョブ1つを必須にすることで、検査を足しても保護設定を変えずに済みます。
#
# 実際に走るコマンドは adapters/<stack>.json から差し込みます。
# プロセスの骨格を言語に依存させないためです。
#
# このワークフローは pull_request で動くため、定義も検査のスクリプトも PR の側から読まれます。同じ PR で集約・検査の一覧を
# 書き換えれば、その PR の gate-g5 は通ります(2026-11-05 の実機の確認)。PR 単位の検査(pr-rules)のうち、PR のコードを実行しない
# 判定は、gate-g5-base.yml が既定ブランチの判定のコードで行い、統制の設定を変える PR に AI維持管理者本人の承認のレビューを求めます。
# テスト・静的解析ほか PR のコードを実行する検査の結果は、統制の設定を変える PR では信頼しないデータとして扱います
# (標準 第4章 G-5「判定のコードの読み元」。process-compass #371 / ADR-0115)

name: gate-g5

on:
  pull_request:
    # edited: PR の本文(トレーラ Spec・リスク区分)を直したときに、pr-rules を再実行する
    # labeled / unlabeled: 停止の申し立て(ラベル state:stop-requested。標準 第7章 7.11)を付けた時点で保留し、
    # 外したときにも解除の記録があるかを確かめ直す
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # 例外承認・停止の解除は、対象の PR の上の記名者本人のレビュー(宣言行つき)でも受け付ける(標準 第4章「判定記録を基底ブランチへ
  # 入れる操作」。process-compass #380 / ADR-0106)。pull_request_review では起動しない(github.base_ref が空になり、
  # 基底との比較を前提とするジョブが飛ばされたまま gate-g5 が通過しうるため)。レビューを出した後は、このワークフローの
  # 最後の実行を再実行する。PR のレビューの手順は実行のたびに API から読み直す
  # PR を経ない体制でも、構成の書き換え(変化点を経ない書き換え、記録の切り詰め)を出荷までに検出する。
  # 既定ブランチへの push で契約検査を走らせ、push の直前のコミットの構成と比べる(標準 第3章 3.13.5)。
  # 既定ブランチの名前が main でない場合は、ここを改める(このファイルは強制層であり、変更は AI維持管理者の承認を要する)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # 停止の申し立てのラベルの付け外しの履歴(issue の events)を読む
  issues: read

jobs:
  # プロセス構成が未設定のあいだは、検査の中身を判定しない
  config:
    name: config
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.read.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      - id: read
        run: |
          v=$(node -e "const c=require('./process.config.json');console.log(c.configured===false?'false':'true')")
          echo "configured=$v" >> "$GITHUB_OUTPUT"
          if [ "$v" = "false" ]; then
            echo "::notice::プロセス構成が未設定です。/process-init を実行するまで G-5 の検査は実施しません"
          fi

  # 構成と設定の整合。ここが落ちたら以降の合格に意味がない
  contract:
    name: gate-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      # 契約検査は、PR では基底ブランチの構成(process.config.json)と比べる。
      # 変化点の記録を経ない構成の書き換えを検出するためである。基底ブランチは GITHUB_BASE_REF から読む
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - if: github.event_name != 'push'
        run: node scripts/gate/verify-gate-contract.mjs
      # 既定ブランチへの push では、push の直前のコミット(github.event.before)の構成と比べる。
      # ブランチの作成(直前のコミットが無い push)では、比べる相手が無いため、連鎖の検査だけを行う
      - if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/gate/verify-gate-contract.mjs
          else
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            node scripts/gate/verify-gate-contract.mjs --base "$BEFORE"
          fi
      # 委任した変更のマージの経路の判定を、フィクスチャで試験する。
      # ワークフロー(delegation.yml)が PR の先頭を checkout していないこと、承認を付けていないことも確かめる
      - run: node scripts/gate/test-check-delegation.mjs
      # PR 単位の検査(check-pr)を、一時のリポジトリのフィクスチャで試験する
      - run: node scripts/gate/test-check-pr.mjs
      # 統制の設定の変更の承認(AI維持管理者本人の承認のレビューを名簿の数値の識別子で照らす)と、基底から読む判定の読み方(--head)、
      # 出荷の証跡の集約の照合(標準 第4章 G-5「統制の設定の変更の承認」。process-compass #371 / ADR-0115)
      - run: node scripts/gate/test-control-approval.mjs
      # 基底から読む判定のワークフロー(gate-g5-base.yml)と record-copy.yml の定義の静的な試験(PR のコードを checkout しない、
      # 権限が最小、check run で結果を出す、既定ブランチの定義で動く。process-compass #371 / ADR-0115)
      - run: node scripts/gate/test-base-judge-workflow.mjs
      # 記録用ブランチの写しと様式の読み取り(records.mjs)、/pit と出荷の証跡の集約がそれを読む経路(process-compass #321 段階2)
      - run: node scripts/gate/test-records.mjs
      - run: node scripts/gate/test-next-records.mjs
      - run: node scripts/gate/test-aggregate-records.mjs
      # 記録用ブランチの履歴の走査・先頭の固定・署名の要否・置き場の規則・書き込める主体の開示(process-compass #379 / ADR-0109)
      - run: node scripts/gate/test-records-history.mjs
      # 検査の道具を動かす Node の版の固定(process-compass #377)
      - run: node scripts/gate/test-gate-node.mjs
      - run: node scripts/gate/test-env-findings.mjs
      # 能力依存の定数の再評価待ち(契機は performer の変化点と暦だけ。#295)
      - run: node scripts/gate/test-recalibration.mjs
      # 独立と席の規則(確認者の有無を名簿と席から導く、出荷判定者が兼ねない席、強制する承認の数。process-compass #302・#304・#305・#307)
      - run: node scripts/gate/test-roster-rules.mjs
      # 企画書の閾値の行(7.6 のエスカレーション閾値と 7.7.4 の自動的な上程の閾値)の記入の検査(process-compass #419 / ADR-0097)
      - run: node scripts/gate/test-brief-thresholds.mjs
      # 当初の見積りの保存(G-1 の時点の見積りの空欄と書き換え)と、見積りと実績の差の記録(process-compass #416 / ADR-0093)
      - run: node scripts/gate/test-brief-estimates.mjs
      # 記録の無い非推奨の兼務を、出荷判定の証跡の集約が記載の欠落にすることを、一時の置き場で通しで試験する(process-compass #312)
      - run: node scripts/gate/test-discouraged-evidence.mjs
      # PR を経ないコミットに区分の下限の規則と判断記録の要否の規則を当てることを、一時の置き場で通しで試験する(process-compass #423)
      - run: node scripts/gate/test-direct-commit-rules.mjs
      # 確定した欠陥の検出工程を、出荷の証跡の集約が欠陥の台帳から数えることを、一時の置き場で通しで試験する(process-compass #413)
      - run: node scripts/gate/test-defect-stages.mjs
      # 上積みとして示した行を、技術負債台帳と履歴に突き合わせることを、一時の置き場で通しで試験する(process-compass #412)
      - run: node scripts/gate/test-uplift-evidence.mjs
      # D-0 表1 の検証の行・決定と同意の列と、企画書の観点3 の出所の区分の検査(process-compass #411)
      - run: node scripts/gate/test-customer-voice.mjs
      # モデルの導入の記録・正解の目録・AI の採点者の較正の記録の検査(process-compass #426)
      - run: node scripts/gate/test-model-adoption.mjs
      # 効力を持つ記録(例外承認の台帳の行・停止の解除の記録)の帰属(process-compass #380 / IMPL-0413・IMPL-0414)
      - run: node scripts/gate/test-material-attribution.mjs
      # 効力を持つ記録のうち、層1・D-0 の決定の記名・前倒しで要る SG の判定記録の帰属(process-compass #428 / IMPL-0415)
      - run: node scripts/gate/test-material-records-more.mjs
      - run: node scripts/gate/test-roster-ids.mjs
      # AI の担い手の名義(seats[].performerAccount)の契約検査・G-6 の数え方・効力を持つ記録の帰属・env-check の照合(process-compass #430 / ADR-0107)
      - run: node scripts/gate/test-performer-account.mjs
      # ホスティングへの書き込みの操作の遮断(.claude/hooks/guard-bash.mjs。process-compass #429 / IMPL-0418)
      - run: node scripts/gate/test-guard-bash.mjs
      # 従う本標準の版・適用の終了・適用の開始の境・述べられる主張の名を、一時の置き場で通しで試験する(process-compass #313)
      - run: node scripts/gate/test-edition-end.mjs
      # 判断記録の状態と置き換えの両側の参照、状態に応じた置き場(標準 第6章 テンプレ2「置き換えと廃止」、第4章 G-3「記載の検査」。process-compass #289)
      - run: node scripts/gate/check-decisions.mjs
      - run: node scripts/gate/test-decisions.mjs
      # G-5 の判定基準を実装する検査が集約(gate-g5)の合否に使われていることの読み方を、ワークフローの写しで試験する。
      # 契約検査と保証の開示 項目4 が同じ読み方を使う(標準 第4章 G-5「判定基準を実装する検査と集約」。process-compass #290)
      - run: node scripts/gate/test-g5-aggregate.mjs
      # 受入基準 → タスクの対応の一覧(G-4 基準6)と、未確定事項の印の件数(G-2・G-4 の前提条件1)を、一時の置き場で試験する。
      # 一覧は判定の材料で合否に使わない。未確定事項が残れば spec-lint --gate が失敗する(process-compass #291)
      - run: node scripts/gate/test-plan-trace.mjs
      # 初期化した直後に G-5 の手元で確かめられる検査が通ることを、テンプレートの全ファイルで試験する(#286)。
      # 構成が設定済みのリポジトリでは省く(テンプレートの初期の状態が無いため)
      - run: node scripts/gate/test-init-g5.mjs
      # カバレッジの測る範囲(変更で加えた・変えたコード / 全体)の判定と、範囲・分母・未計測の製品ファイルの件数(標準 第4章 G-5 基準3。process-compass #296)
      - run: node scripts/gate/test-coverage-scope.mjs
      # 自己修正ループの停止条件(無進捗・連続失敗)と保留の解除の名義(標準 第3章 3.12.10。process-compass #296)
      - run: node scripts/gate/test-self-heal.mjs
      # 規模の観測の決定性と、超過の理由の内訳・別集計の倍率の分布(標準 第4章「基準値を超えた変更の扱い」。process-compass #296)
      - run: node scripts/gate/test-size-observation.mjs
      # 文脈ファイルの参照切れの検査(G-5 基準6。相対リンク・取り込み @path・逆引用符の中の .claude/ と scripts/ のパス。process-compass #314 / ADR-0084)
      - run: node scripts/gate/test-context-refs.mjs
      # 常駐の規則の照合: 規則ごとの核の文言の照合と、試験の中の固定の写しへの変異(行の削除・節の置き換え・否定の除去・
      # 複数行のコメントで囲む)で落ちること。案件の CLAUDE.md は読まない(process-compass #314 / ADR-0084)
      - run: node scripts/gate/test-claude-md-resident.mjs
      # 曖昧語の検査の検出語の知識ベース: 無い・空なら失敗すること(標準 第4章 G-2。process-compass #314)
      - run: node scripts/gate/test-spec-lint.mjs
      # 外部の確認者の記名による緩める向きの決定を、変化点の入口が拒否すること(標準 第3章 3.13.3。process-compass #314 / ADR-0084)
      - run: node scripts/gate/test-loosening-decider.mjs
      # 氏名の確認と、確認した氏名の使用(任命・委任の席)を同じ変化点に含むときの評価の時点(標準 第4章 G-6。process-compass #375 / ADR-0111)
      - run: node scripts/gate/test-name-confirmation-timing.mjs
      # 保証の開示の項目2(テーラリングの宣言): S1 の G-6 の範囲の限定と、旧い構成の G-7 の簡略の未適用の厳格化(標準 第4章 G-7。process-compass #374 / ADR-0112)
      - run: node scripts/gate/test-tailoring-declaration.mjs
      # 安全重要度の判定の記録と確認(D-0 節16): 判定の記録の欄と判定者の記名で G-1 を止めること、確認者の記名と段、
      # 区分を下げる変化点の引き下げの根拠、出荷の証跡の集約の未達と欠落(標準 第8章 軸E。process-compass #373 / ADR-0113)
      - run: node scripts/gate/test-cl-judgment.mjs
      # 既存のリポジトリへの持ち込み: 適用の開始の境(第1親の連鎖)、開始より前の履歴の扱い、事前点検、フックの登録・@OWNER、
      # 構成の形式の版と移行、取り込んだテンプレートの記録(標準 第1章 1.10.1・1.10.3。process-compass #315 / ADR-0085)
      - run: node scripts/gate/test-adoption.mjs
      # 実環境の統制の確認(env-check)の4値と確認の項目を、模擬の gh で試験する(附属書I I.11 要件⑦。process-compass #315)
      - run: node scripts/gate/test-env-check.mjs

  # 基準1 全テスト GREEN / 基準3 カバレッジ
  test:
    name: test
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      # 変更の範囲のカバレッジは、比較の起点との差分を読む(全履歴を取得する。#296)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      - uses: ./.github/actions/setup-stack
      - name: テスト
        id: test
        run: node scripts/gate/adapter.mjs run test
      # G-7 基準1(計画したテストの消化)の入力。テストの実行の結果と、テストのファイルの一覧を記録する(#288)。
      # ship-evidence が license-scan と同じ経路で取り込み、出荷判定の証跡の集約が「実行して通過した数」を数える
      - name: テストの実行の記録
        if: always()
        run: node scripts/gate/test-results.mjs --outcome "${{ steps.test.outcome }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: evidence/test-results.json
          if-no-files-found: ignore
      - name: カバレッジの取得
        run: node scripts/gate/adapter.mjs run coverage
      # 測る範囲が変更の範囲(構成 ci.coverageScope: changed。既定)のとき、比較の起点が要る(process-compass #296)。
      # PR では基底ブランチ、既定ブランチへの push では push の直前のコミット、それ以外(手動の実行・ブランチの作成)では直前のコミット
      - name: カバレッジの判定
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/gate/coverage-check.mjs --base "origin/${BASE_REF}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/gate/coverage-check.mjs --base "$BEFORE"
          else
            node scripts/gate/coverage-check.mjs --base HEAD^
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-result
          path: evidence/coverage-result.json
          if-no-files-found: ignore

  # 基準2 静的解析・脆弱性の重大指摘
  static-analysis:
    name: static-analysis
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      - uses: ./.github/actions/setup-stack
      - name: 静的解析
        run: node scripts/gate/adapter.mjs run lint
      - name: 依存の脆弱性
        run: node scripts/gate/adapter.mjs run audit

  # 基準4 曖昧語チェック。構成に依存しないため常に走らせる。引数なし = 機能仕様の置き場(specs/F-NNN/)だけを見る。
  # 手元でも引数なしで実行すれば同じ範囲になる(#286)
  spec-lint:
    name: spec-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      - run: node scripts/gate/spec-lint.mjs

  # 基準6 文脈ファイルの形式検査のうち、リポジトリ内の参照切れ(相対リンクと取り込み @path)。構成に依存しないため常に走らせる。
  # 見出しのアンカー、逆引用符の中の .claude/・scripts/ 以外で始まるパス、1ファイルの分量の上限は確かめない(process-compass #314 / ADR-0084 決定3)
  context-format:
    name: context-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      - run: node scripts/gate/check-context-refs.mjs

  # 基準5 依存関係のライセンス検査(合否条件)
  #
  # 生成物と既存著作物の類似検知は合否条件にしません。「検出されなかった」が
  # 「潔白である」という記録として残ると、依拠性の推認に対する防御になりません。
  # 判定するのは、定めた検査を実施し記録したことです。
  ip-clearance:
    name: ip-clearance
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      - uses: ./.github/actions/setup-stack
      - name: 依存関係のライセンス
        id: lic
        run: node scripts/gate/adapter.mjs run licenses
      - name: 検査の実施記録
        if: always()
        run: |
          mkdir -p evidence
          printf '{ "scanRun": true, "result": "%s", "scannedAt": "%s" }\n' \
            "${{ steps.lic.outcome }}" "$(date -u +%FT%TZ)" > evidence/license-scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-scan
          path: evidence/license-scan.json

  # 基準7 秘匿情報の混入検査。台帳記録による通過を認めない唯一の基準
  secret-scan:
    name: secret-scan
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      - uses: ./.github/actions/setup-stack
        with:
          install: 'false'
      - name: 秘匿情報の混入検査
        run: node scripts/gate/adapter.mjs run secretScan

  # 基準8 依存関係の追加・更新の識別。合否は判定せず一覧を出す
  dependency-diff:
    name: dependency-diff
    # 基底ブランチとの差分を出す。基底を持たない push では実行しない
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      - run: git fetch origin "${{ github.base_ref }}" --depth=50 || true
      - run: node scripts/gate/dependency-diff.mjs --base "origin/${{ github.base_ref }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-diff
          path: evidence/dependency-diff.json
          if-no-files-found: ignore

  # PR 単位の検査(#286): トレーラ Spec、変更規模の上限、閾値・除外設定と製品のコードの同時変更(禁止事項6)。
  # 既存のテストの変更(削除・期待値の変更)は、G-6 の材料として PR へ一覧を出す(失敗にはしない)。
  # 規模の基準値と、台帳の既存の例外承認の行は、基底ブランチの構成と台帳から読む。同じ PR で足した例外承認の行は、承認した者本人の
  # レビュー(宣言行 例外承認: 行の ID)で帰属を裏づけたものだけを数える(#380)。超過は失敗にせず、規模の確認を要する(#295)。
  # 停止の申し立て(ラベル state:stop-requested)が付いた PR は、権限者本人の解除のレビューか、基底ブランチの解除の記録(権限者本人の
  # 操作で帰属を裏づけたもの)があるまで失敗させる(#288・#380)。
  # PR の題名と本文は環境変数で渡す(シェルへ展開しない)
  pr-rules:
    name: pr-rules
    needs: config
    if: github.event_name == 'pull_request' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 検査の道具(scripts/gate/)を動かす Node の版を固定する(.github/gate-node-version。process-compass #377)。
      # 製品の実行環境(アダプタの runtimeVersion)は、後の setup-stack が別に用意する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .github/gate-node-version
      # 差分は PR の基底から取り、基準値・名簿・規則・台帳・停止の申し立ての解除は既定ブランチから読む(--policy-base)。
      # スタックの上の層では基底が下の層のブランチになり、既定ブランチへ入っていない下の層の基準値で判定しないためである
      # (標準 フェーズ5「スタック型 PR」・CI/CD ゲート構成の pr-rules。process-compass #294 / ADR-0078)
      - env:
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
      # 停止の申し立て(標準 第7章 7.11)のラベルの付け外しの履歴。ラベルを外しただけで保留が解けないようにする。
      # 取得に失敗した場合は空にする(現在のラベルだけで判定し、その限界は check-pr.mjs の冒頭に書いてある)
      - name: ラベルの履歴
        id: label-events
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ev=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/events" --paginate \
            --jq '.[] | select(.event == "labeled" or .event == "unlabeled") | {event, label: .label.name, at: .created_at, actor: .actor.login}' \
            | jq -s -c . 2>/dev/null) || ev=''
          { echo 'events<<PIT_IN_EVENTS'; echo "${ev}"; echo 'PIT_IN_EVENTS'; } >> "$GITHUB_OUTPUT"
      # G-6 の承認者の数(構成 review.reviewerCount。規制業・CL3 は 2 名)。レビューの一覧を渡し、check-pr が
      # 「G-6 の承認者 N 名 / 要求 M 名」を出す(合否にはしない。理由は check-pr.mjs の冒頭)。取得に失敗した場合は
      # 空にする(check-pr は「読めない」とその旨を出す)。同じ一覧から、項目番号と期限を欠く変更要求(CHANGES_REQUESTED)を
      # 「理由の無い差し戻し」として出す(標準 第4章 G-6「承認レビューを判定記録とする条件」の条件1。合否にはしない。#321)
      - name: PR のレビュー
        id: reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rv=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq '.[] | {id, state, body, submitted_at, commit_id, author_association, author: {login: .user.login, id: .user.id, is_bot: (.user.type == "Bot")}}' \
            | jq -s -c . 2>/dev/null) || rv=''
          # レビューの本文を書き手以外が編集したか(editor)。効力を持つ記録のレビュー(宣言行 例外承認・停止の解除)は、
          # 書き手以外が編集したものを数えない(process-compass #380 / ADR-0106 / EV-0220)。GraphQL で引けたレビューにだけ edited_by を足す
          # (引けないレビューは edited_by が無く、検査は「編集の記録を読めない」として宣言行のレビューを数えない)
          ed=$(gh api graphql -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F number="${PR_NUMBER}" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviews(first:100){nodes{databaseId editor{login}}}}}}' \
            --jq '[.data.repository.pullRequest.reviews.nodes[] | {key: (.databaseId | tostring), value: (.editor.login // "")}] | from_entries' 2>/dev/null) || ed=''
          if [ -n "$rv" ] && [ -n "$ed" ]; then
            rv=$(printf '%s' "$rv" | jq -c --argjson ed "$ed" 'map((.id | tostring) as $k | if ($ed | has($k)) then . + {edited_by: (if $ed[$k] == "" then null else $ed[$k] end)} else . end)') || rv=''
          fi
          { echo 'reviews<<PIT_IN_REVIEWS'; echo "${rv}"; echo 'PIT_IN_REVIEWS'; } >> "$GITHUB_OUTPUT"
      - name: PR の検査
        env:
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # PR の作成者の数値の識別子。名簿の照合は識別子で行う(process-compass #430 / ADR-0108)
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_LABEL_EVENTS: ${{ steps.label-events.outputs.events }}
          PR_REVIEWS: ${{ steps.reviews.outputs.reviews }}
          # レビューの対象のコミットと照合する PR の先頭(checkout はマージのコミットを取り出すため、別に渡す。#380)
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gate/check-pr.mjs --base "origin/${BASE_REF}" --policy-base "origin/${DEFAULT_BRANCH}" --report evidence/pr-checks.md --comment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-checks
          path: evidence/pr-checks.md
          if-no-files-found: ignore

  # 集約。ブランチ保護の必須ステータスチェックはこのジョブ名を指す
  gate-g5:
    name: gate-g5
    runs-on: ubuntu-latest
    needs: [config, contract, test, static-analysis, spec-lint, context-format, ip-clearance, secret-scan, pr-rules]
    if: always()
    steps:
      - name: 全検査の結果を突合する
        run: |
          echo "configured:      ${{ needs.config.outputs.configured }}"
          echo "contract:        ${{ needs.contract.result }}"
          echo "test:            ${{ needs.test.result }}"
          echo "static-analysis: ${{ needs.static-analysis.result }}"
          echo "spec-lint:       ${{ needs.spec-lint.result }}"
          echo "context-format:  ${{ needs.context-format.result }}"
          echo "ip-clearance:    ${{ needs.ip-clearance.result }}"
          echo "secret-scan:     ${{ needs.secret-scan.result }}"
          echo "pr-rules:        ${{ needs.pr-rules.result }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::G-5 は通過していません"
            exit 1
          fi
          if [ "${{ needs.config.outputs.configured }}" != "true" ]; then
            echo "::warning::プロセス構成が未設定のため、検査を実施していません。/process-init を実行してください"
            exit 0
          fi
          echo "::notice::G-5 通過"
