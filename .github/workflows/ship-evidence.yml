# G-7 出荷判定の証跡を集約する
#
# 出荷判定者に数値の十分性を判定させません。閾値の充足は G-5 が機械で判定済みです。
# ここで行うのは記録と基準の突合だけです。
#
# 未達のゲートがある場合、品質レポートへ必ず記載されます。隠す経路はありません。
#
# PR の変更として数えるのは、PR のマージコミットと一致するコミットだけです(件名の番号に依らない)。
# PR とコミットの関係は、gh(PR の mergeCommit と、コミットに対応づく PR)で取得します。
# G-7 の基準ごとに、機械が確かめた範囲と、出荷判定者が突合する記録を、品質レポートの冒頭に出します。
# 委任で先へ進めた変更の、期間ごとの保証の開示は assurance-period ワークフローが出します。
#
# 検出能力の測定の記録(保証の開示 項目6)は、導入前の検証の tally がコミットする docs/adoption-trial/seeded-errors.json を
# 集約が先に読みます(checkout に含まれる。取り込みの手順は要りません)。evidence/seeded-errors.json は .gitignore の下にあり、
# 別の経路(成果物のダウンロードなど)でこの実行へ置いた場合にだけ読まれます。両方あれば測定時点の新しいほうを採り、出所を出します(#288)。
#
# 知財潔白性の検査記録(license-scan)は、gate-g5 の ip-clearance ジョブが別の実行で作る成果物です。
# 出荷の対象のコミットに対する gate-g5 の成功した実行から、gh run download で取り込みます(#286)。
# **このワークフローは、2026-10-01 時点で、実際の GitHub 上で実行して確かめていません**。確かめたのは、
# 構文と、gh を模擬した呼び出しの形までです。初回の出荷では、Actions の実行の記録で、取り込みの行を確かめてください。

name: ship-evidence

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      from:
        description: 起点のタグ
        required: false
      to:
        description: 終点のタグ
        required: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  evidence:
    name: ship-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # download-artifact は、この実行の成果物しか取れない(gate-g5 は別のワークフローの実行)。
      # 出荷の対象のコミット(--to、無ければ checkout したコミット)に対する gate-g5 の成功した実行を探し、
      # その実行の license-scan を取る。gate-g5 は既定ブランチへの push でも走るため、マージ後のコミットに実行がある。
      # 取得できなければ取り込まない。集約が「知財潔白性の検査記録がありません」を欠落として出す(隠さない)
      - name: 知財潔白性の検査記録を gate-g5 の実行から取り込む
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ inputs.to }}
        run: |
          target=$(git rev-parse "${TO:-HEAD}^{commit}")
          run=$(gh run list --repo "${{ github.repository }}" --workflow gate-g5 --commit "$target" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then
            gh run download "$run" --repo "${{ github.repository }}" --name license-scan --dir evidence
            echo "::notice::gate-g5 の実行 $run から license-scan を取り込みました(対象 $target)"
            # G-7 基準1 の入力(テストの実行の記録。#288)。取得できなければ、集約が「実行の記録なし」と出す
            gh run download "$run" --repo "${{ github.repository }}" --name test-results --dir evidence \
              && echo "::notice::gate-g5 の実行 $run から test-results を取り込みました" \
              || echo "::warning::gate-g5 の実行 $run に test-results がありません。G-7 基準1 の消化数は数えません"
          else
            echo "::warning::$target に対する gate-g5 の成功した実行がありません。知財潔白性の検査記録とテストの実行の記録は取り込みません"
          fi

      # 保証の開示の項目1・3・6 へ、前回の出荷の値を併記するための入力。
      # 取得できない場合(初回、成果物の保存期間の経過)は「前回なし」と出力される
      - name: 前回の出荷の証跡を取り込む
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "${{ github.repository }}" --workflow ship-evidence --status completed --limit 20 --json databaseId --jq "map(select(.databaseId != ${{ github.run_id }})) | .[0].databaseId // empty")
          if [ -n "$prev" ]; then
            gh run download "$prev" --repo "${{ github.repository }}" --name ship-evidence --dir evidence/previous
          fi

      - name: 証跡を集約する
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/gate/aggregate-evidence.mjs \
            ${{ inputs.from && format('--from {0}', inputs.from) || '' }} \
            ${{ inputs.to && format('--to {0}', inputs.to) || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-evidence
          # assurance-disclosure.external.md は、組織の外へ渡す保証の開示。項目6 を値で出さない。
          # 外へ渡すときは、このファイルをそのまま使う(人が差し替えない)
          path: |
            evidence/evidence.json
            evidence/quality-report.md
            evidence/assurance-disclosure.external.md
          if-no-files-found: error
