name: 不具合
description: 期待した挙動と異なる。観測できた事象で書く
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: 観測した事象
      description: 画面・ログ・レスポンスなど、観測できたものを書きます
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した挙動
      description: どの受入基準に反しているか(F-xxx)が分かれば添えてください
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 再現の手順
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 重大度
      description: 技術的な難しさではなく、利用者から見た帰結で選びます(標準 第4章「欠陥トリアージ基準」の3段階)。報告の時点の見立てであり、欠陥の台帳の重大度は人が確定します
      options:
        - Sev1 システムまたは主要機能が停止する / データが破損・消失する / 認証・認可が破られる(いずれも回避策が無い)
        - Sev2 主要機能に障害があるが、文書化された回避策がある / 副次機能が停止する
        - Sev3 機能は動作するが、表示・操作性・性能が仕様を満たさない(業務は継続できる)
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: 起票の経路(任意)
      description: この報告を起こしたもの。欠陥の台帳の「起票の経路」へ写します。報告は、欠陥の台帳で処分「欠陥」と確定するまで欠陥の件数に数えません(標準 運用メトリクス)
      options:
        - 人
        - AI の層(AI のレビュー・AI のエージェント)
        - 機械の検査
        - 利用者
        - 運用の事象(監視の警報など)
    validations:
      required: false
